name: HERA — Weekly Review

on:
  schedule:
    # Sunday weekly review: 20:00 UTC = 21:00 BST (summer)
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  hera:
    name: HERA weekly review
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly review
        run: |
          curl -f -s -X POST \
            -H "Authorization: Bearer ${{ secrets.MAIA_API_KEY }}" \
            "https://maia-pa-production.up.railway.app/api/hera/nudge"
