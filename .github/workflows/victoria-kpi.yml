name: VICTORIA — Weekly Scorecard

on:
  # VICTORIA removed from dashboard nav/routing — schedule disabled, keep
  # workflow_dispatch for manual runs if needed.
  workflow_dispatch:

jobs:
  victoria:
    name: VICTORIA scorecard
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scorecard
        run: |
          curl -f -s -X POST \
            -H "Authorization: Bearer ${{ secrets.MAIA_API_KEY }}" \
            "https://maia-pa-production.up.railway.app/api/victoria/nudge"
